name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: false
      - name: Test
        run: go test ./...
      - name: Browser runtime tests
        run: node --test tests/browser/*.test.mjs
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
